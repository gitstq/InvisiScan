name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no network needed beyond pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

      - name: Verify zero third-party runtime dependencies
        shell: bash
        run: |
          python -m pip install --quiet pipdeptree || true
          DEPS=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(len(data['project']['dependencies']))
          ")
          echo "runtime dependencies declared: $DEPS"
          test "$DEPS" = "0"

      - name: Self scan must be clean
        run: python -m invisiscan invisiscan --format json

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          invisiscan --version
          printf 'x = \xe2\x80\x8b\n' > /tmp/dirty.py
          invisiscan /tmp/dirty.py || echo "correctly detected invisible character"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
