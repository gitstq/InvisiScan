name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 runners no longer ship Python 3.9/3.10 builds, so those
        # versions cannot be exercised here even though the code targets 3.9+.
        # See README "Requirements" for the supported / verified breakdown.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no network needed beyond pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

      - name: Verify zero third-party runtime dependencies
        # Spelled out rather than reading pyproject via tomllib, which only
        # exists on 3.11+; this keeps the check honest on every tested version.
        shell: bash
        run: |
          COUNT=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          block = re.search(r"^dependencies\s*=\s*\[(.*?)\]", text, re.S | re.M)
          if block is None:
              raise SystemExit("no dependencies block found")
          entries = [
              line.strip().strip(",")
              for line in block.group(1).splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          print(len(entries))
          PY
          )
          echo "runtime dependencies declared: $COUNT"
          test "$COUNT" = "0"

      - name: Ensure output survives a legacy codepage
        # Guards the Windows default cp1252 stdout, which cannot encode U+200B
        # or Cyrillic -- without cli.force_utf8_stdio() the scanner crashes
        # mid-report. A genuine finding also exits 1, so assert on rendered
        # content and JSON validity rather than the exit code.
        shell: bash
        run: |
          TEXT_OUT=$(PYTHONIOENCODING=cp1252 python -m invisiscan tests/fixtures/homograph.py 2>&1 || true)
          echo "$TEXT_OUT"
          echo "$TEXT_OUT" | grep -q "confusable-identifier" || { echo "::error::no finding rendered under cp1252"; exit 1; }

          JSON_OUT=$(PYTHONIOENCODING=cp1252 python -m invisiscan tests/fixtures/homograph.py --format json 2>&1 || true)
          echo "$JSON_OUT" | python -c "import json,sys; json.load(sys.stdin)" || { echo "::error::invalid JSON under cp1252"; exit 1; }
          echo "survived cp1252 in both text and json modes"

      - name: Self scan must be clean
        run: python -m invisiscan invisiscan --format json

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          invisiscan --version
          printf 'x = \xe2\x80\x8b\n' > /tmp/dirty.py
          invisiscan /tmp/dirty.py || echo "correctly detected invisible character"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
